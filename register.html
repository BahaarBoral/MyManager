<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>MyManager | Register</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/themes.js"></script>
</head>

<body class="auth-body">

  <!-- Global Scripts (Themes & Loader) -->
  <script src="js/loader.js"></script>

  <div class="auth-card">
    <h1>Join MyManager 🌸</h1>
    <p class="auth-subtext">Small habits. Big changes.</p>

    <label>Email</label>
    <input type="email" id="regEmail" placeholder="you@college.com">

    <label>Password</label>
    <input type="password" id="regPassword" placeholder="Create a password">

    <button class="auth-btn" onclick="register()">Register</button>

    <p class="auth-switch">
      Already have an account? <a href="login.html">Log in</a>
    </p>

    <p id="registerMessage" class="auth-message"></p>
  </div>

  <script src="js/auth.js"></script>

  <!-- Enter key to register -->
  <script>
    document.addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        register();
      }
    });
  </script>

</body>

</html>
